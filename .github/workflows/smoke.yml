name: Smoke Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: |
          npm run dev > /tmp/server.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Server is up";
              exit 0;
            fi
            sleep 1
          done
          echo "Server failed to start";
          cat /tmp/server.log;
          exit 1

      - name: Run smoke tests
        run: npm run smoke
